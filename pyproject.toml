[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autosoc"
version = "0.1.0"
description = "Deterministic-first, offline-safe SOC triage pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1.6,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.32,<1",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[project.scripts]
autosoc = "autosoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autosoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
