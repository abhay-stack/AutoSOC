services:
  autosoc:
    image: autosoc:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${AUTOSOC_UID:-1000}"
        APP_GID: "${AUTOSOC_GID:-1000}"
    init: true
    user: "${AUTOSOC_UID:-1000}:${AUTOSOC_GID:-1000}"
    ports:
      - "${AUTOSOC_PORT:-8000}:8000"
    environment:
      AUTOSOC_DATA_DIR: /app/data
      AUTOSOC_ALLOWED_HOSTS: "${AUTOSOC_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      AUTOSOC_ENABLE_LIVE_PROVIDERS: "${AUTOSOC_ENABLE_LIVE_PROVIDERS:-false}"
      AUTOSOC_RATE_LIMIT_PER_MINUTE: "${AUTOSOC_RATE_LIMIT_PER_MINUTE:-60}"
      AUTOSOC_OPENAI_MODEL: "${AUTOSOC_OPENAI_MODEL:-gpt-5-nano}"
      AUTOSOC_WEB_USERNAME: "${AUTOSOC_WEB_USERNAME:-autosoc}"
      AUTOSOC_WEB_PASSWORD: "${AUTOSOC_WEB_PASSWORD:-}"
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY:-}"
      GREYNOISE_API_KEY: "${GREYNOISE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
